<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - CO & CO</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>
<body class="bg-light">

    <!-- Navbar -->
        <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{{ url_for('main.index') }}">
                <i class="bi bi-building"></i> CO & CO
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-medium">
                    <!-- Menu yang mengarah ke halaman utama -->
                    <li class="nav-item">
                        <a class="nav-link {{ 'active text-primary' if request.endpoint == 'main.index' else '' }}" href="{{ url_for('main.index') }}">Home</a>
                    </li>
                    <!-- Menu yang mengarah ke section pricing di halaman utama -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.index') }}#pricing">Price List</a>
                    </li>
                    <!-- Menu yang mengarah ke section maps di halaman utama -->
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.index') }}#maps">Contact & Location</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted">
        <small>&copy; 2026 CO & CO. All rights reserved.</small>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
